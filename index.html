<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {text-align: center;  font-size: 11px; }
        .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
    <img src="img/avatar-jessica.jpeg" alt="Jessica" class="jessica">
    <h1>
      Jessica Randall
    </h1>
    <h3 class="country">
      London, United Kingdom
    </h3>
    <p>"Front-end developer and avid reader."</p>
    <div class="table">
        <div class="table-button">
        <button class="btn">GitHub</button>   
        <button class="btn">Frontend Mentor</button>  
        <button class="btn">LinkedIn</button>  
        <button class="btn">Twitter</button>  
        <button class="btn">Instagram</button>  
        </div>
    </div>
  </div>
  <footer>
    <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by 
    <a href="#">HONIKON</a>.
  </div>
  </footer>
</body>
</html>
